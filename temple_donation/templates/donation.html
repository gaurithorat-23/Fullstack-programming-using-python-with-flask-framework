<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h2>Temple Donation List</h2>

<table border="1" cellpadding="8">
    <tr>
        <th>Donation ID</th>
        <th>Donor Name</th>
        <th>Amount</th>
        <th>Purpose</th>
    </tr>

    {% for d in donations %}
    <tr>
        <td>{{ d[0] }}</td>
        <td>{{ d[1] }}</td>
        <td>{{ d[2] }}</td>
        <td>{{ d[3] }}</td>
    </tr>
    {% endfor %}
</table>

<h3>Total Donations: {{ total }}</h3>

<a href="/">Add Donation</a>
<br><br>

<a href="/update">Update Donation Amount</a>
<br><br>

<a href="/delete">Delete Donation</a>

</body>
</html>
